<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Khobragade CSC</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Khobragade CSC</h1>

        <p>Administrator Login</p>

        <input
        type="email"
        id="email"
        placeholder="Enter Email">

        <input
        type="password"
        id="password"
        placeholder="Enter Password">

        <button id="loginBtn">
            Login
        </button>

        <p id="message"></p>

    </div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
