<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Failed - KCSC Portal</title>
<link rel="stylesheet" href="assets/portal.css?v=20260821-live23">
<style>
.result-wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:linear-gradient(135deg,#fff7ed,#fff1f2)}
.result-card{width:min(720px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(15,23,42,.12);text-align:center}.result-icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#fee2e2;font-size:38px}.result-card h1{margin:0 0 8px;font-size:32px;color:#0f172a}.result-card p{color:#64748b}.result-meta{margin:22px 0;text-align:left;background:#f8fafc;border-radius:16px;padding:18px}.result-meta div{display:flex;justify-content:space-between;gap:18px;padding:8px 0;border-bottom:1px dashed #dbe3ee}.result-meta div:last-child{border-bottom:0}.result-meta b{word-break:break-all;color:#0f172a}.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<main class="result-wrap">
<section class="result-card">
<div class="result-icon">❌</div>
<span class="dashboard-kicker">PAYMENT NOT COMPLETED</span>
<h1>Payment Failed / Cancelled</h1>
<p>Payment complete nahi hua. Aap dobara Pay Now se retry kar sakte hain.</p>
<div class="result-meta">
<div><span>Application ID</span><b id="applicationId">—</b></div>
<div><span>Transaction ID</span><b id="txnid">—</b></div>
</div>
<div class="result-actions">
<a class="btn btn-primary" id="retryLink" href="my-applications.html">Try Again</a>
<a class="btn btn-soft" href="my-applications.html">My Applications</a>
</div>
</section>
</main>
<script>
const q=new URLSearchParams(location.search),app=q.get('applicationId')||'';
document.getElementById('applicationId').textContent=app||'—';
document.getElementById('txnid').textContent=q.get('txnid')||'—';
</script>
</body>
</html>
