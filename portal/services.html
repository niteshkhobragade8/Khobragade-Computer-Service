<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Services - KCSC Portal</title><link rel="stylesheet" href="assets/portal.css"></head><body><div class="topbar"><div class="container">Online Digital Seva & Application Portal</div></div><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">K</span><span><b>Khobragade Computer Service Centre</b><small>Applications & Payments Portal</small></span></a><div class="navlinks"><a href="index.html">Home</a><a class="active" href="services.html">Services</a><a href="track.html">Track</a><span id="navAuth"></span></div></div></header><main class="section"><div class="container"><div class="section-head"><div><h2>All Services</h2><p>New Apply, Correction, Download aur other actions service-wise available honge.</p></div></div><div class="toolbar"><input id="q" placeholder="Search service..."><select id="status"><option value="all">All</option><option>Available</option><option>Unavailable</option><option>Coming Soon</option></select></div><div id="servicesGrid" class="grid"></div></div></main><footer class="footer"><div class="container">Khobragade Computer Service Centre</div></footer><div id="actionModal" class="modal"><div class="modal-card"><button class="btn btn-soft" style="float:right" onclick="actionModal.classList.remove('show')">✕</button><h2 id="modalTitle">Service</h2><div id="actionsBox"></div></div></div><script type="module" src="assets/portal.js"></script><script type="module">
let rows=await Portal.services().catch(()=>[]);const requested=new URLSearchParams(location.search).get('q')||'';q.value=requested;function render(){const term=q.value.toLowerCase(),st=status.value;const filtered=rows.filter(x=>(!term||`${x.name||''} ${x.category||''} ${x.description||''}`.toLowerCase().includes(term))&&(st==='all'||(x.availabilityStatus||'Available')===st));servicesGrid.innerHTML=filtered.map(x=>{const s=x.availabilityStatus||'Available',disabled=s!=='Available';return `<article class="card"><div class="icon">${Portal.esc(x.icon||'📄')}</div><span class="status ${Portal.statusClass(s)}">${Portal.esc(s)}</span><h3>${Portal.esc(x.name)}</h3><p>${Portal.esc(x.description||'')}</p><small>${Portal.esc(x.category||'Digital Service')}</small><div class="actions"><button class="btn ${disabled?'btn-soft':'btn-primary'}" data-id="${x.id}" ${disabled?'disabled':''}>${s==='Coming Soon'?'Coming Soon':s==='Unavailable'?'Currently Unavailable':'Apply / Actions'}</button></div></article>`}).join('')||'<div class="card">No matching services.</div>'}q.oninput=render;status.onchange=render;render();servicesGrid.onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const svc=rows.find(x=>x.id===b.dataset.id);modalTitle.textContent=svc.name;const acts=await Portal.actions(svc.id);actionsBox.innerHTML=acts.length?acts.map(a=>{const st=a.availabilityStatus||((a.available!==false)?'Available':'Unavailable');return `<article class="card" style="margin-top:12px"><span class="status ${Portal.statusClass(st)}">${Portal.esc(st)}</span><h3>${Portal.esc(a.name)}</h3><p>${Portal.esc(a.description||'')}</p><div class="price">${Portal.money(a.serviceCharge||0)} <small>Service Charge</small></div>${Number(a.officialFee||0)>0?`<p>Official Fee: ${Portal.money(a.officialFee)}</p>`:''}<ol class="doc-list">${(a.requiredDocuments||[]).map(d=>`<li>${Portal.esc(d)}</li>`).join('')}</ol><div class="actions"><a class="btn btn-primary ${st!=='Available'?'disabled':''}" ${st==='Available'?`href="apply.html?service=${svc.id}&action=${a.id}"`:'style="pointer-events:none;opacity:.5"'}>Apply Now</a></div></article>`}).join(''):'<div class="notice">Is service ke actions abhi Admin se add nahi hue.</div>';actionModal.classList.add('show')};
</script></body></html>
