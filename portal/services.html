<!doctype html>
<html class="member-shell-wait" lang="en">
<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Services - KCSC Portal</title>
<link rel="stylesheet" href="assets/portal.css?v=20260823-shellready2">
</head>
<body>
<div class="topbar"><div class="container">Online Digital Seva & Application Portal</div></div>
<header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">K</span><span><b>Khobragade Computer Service Centre</b><small>Applications & Payments Portal</small></span></a><div class="navlinks"><a href="index.html">Home</a><a class="active" href="services.html">Services</a><a href="track.html">Track</a><span id="navAuth"></span></div></div></header>
<main class="section"><div class="container">
  <div class="section-head"><div><h2>All Services</h2><p>New Apply, Correction, Download aur other actions service-wise available honge.</p></div><div class="notice" id="serviceCountBadge" style="margin:0">Loading services...</div></div>
  <div class="toolbar"><input id="q" placeholder="Search service..."><select id="status"><option value="all">All</option><option>Available</option><option>Unavailable</option><option>Coming Soon</option></select></div>
  <div id="servicesGrid" class="grid"></div>
</div></main>
<footer class="footer"><div class="container">Khobragade Computer Service Centre</div></footer>
<div id="actionModal" class="modal"><div class="modal-card"><button id="closeActionModal" class="btn btn-soft" style="float:right">✕</button><h2 id="modalTitle">Service</h2><div id="actionsBox"></div></div></div>

<!-- Portal chrome/auth is loaded separately. Even if Firebase fails, catalogue below still renders. -->
<script type="module">
if('scrollRestoration' in history)history.scrollRestoration='manual';window.scrollTo(0,0);

import './assets/portal.js?v=20260823-shellready2';

import {MASTER_SERVICES,actionId} from './assets/master-catalog.js?v=20260821-final24r3';

const els={
  q:document.getElementById('q'),status:document.getElementById('status'),grid:document.getElementById('servicesGrid'),badge:document.getElementById('serviceCountBadge'),modal:document.getElementById('actionModal'),title:document.getElementById('modalTitle'),actions:document.getElementById('actionsBox'),close:document.getElementById('closeActionModal')
};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const statusClass=s=>String(s||'').toLowerCase().replace(/\s+/g,'-');
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const masterRows=()=>MASTER_SERVICES.map(s=>({id:`svc_${s.id}`,name:s.name,category:s.category,icon:s.icon,description:s.description,status:'Published',availabilityStatus:'Available',featured:false,masterServiceId:s.id,_master:s}));

let rows=masterRows();
const requested=new URLSearchParams(location.search).get('q')||'';
els.q.value=requested;

function render(){
  const term=els.q.value.trim().toLowerCase(),st=els.status.value;
  const filtered=rows.filter(x=>(!term||`${x.name||''} ${x.category||''} ${x.description||''}`.toLowerCase().includes(term))&&(st==='all'||(x.availabilityStatus||'Available')===st));
  els.badge.textContent=`${rows.length} Services Loaded`;
  els.grid.innerHTML=filtered.length?filtered.map(x=>{const s=x.availabilityStatus||'Available',disabled=s!=='Available';return `<article class="card"><div class="icon">${esc(x.icon||'📄')}</div><span class="status ${statusClass(s)}">${esc(s)}</span><h3>${esc(x.name)}</h3><p>${esc(x.description||'')}</p><small>${esc(x.category||'Digital Service')}</small><div class="actions"><button class="btn ${disabled?'btn-soft':'btn-primary'}" data-id="${esc(x.id)}" ${disabled?'disabled':''}>${s==='Coming Soon'?'Coming Soon':s==='Unavailable'?'Currently Unavailable':'Apply / Actions'}</button></div></article>`}).join(''):'<div class="card">No matching services.</div>';
}

// Guaranteed first render from the bundled catalogue; no Firebase permission is needed for this.
render();
els.q.addEventListener('input',render);els.status.addEventListener('change',render);els.close.addEventListener('click',()=>els.modal.classList.remove('show'));

async function mergeAdminData(){
  try{
    if(!window.Portal||typeof window.Portal.services!=='function')return;
    const live=await window.Portal.services();
    if(!Array.isArray(live)||!live.length)return;
    const byName=new Map(live.map(x=>[norm(x.name),x]));
    rows=masterRows().map(m=>{
      const l=byName.get(norm(m.name));
      return l?{...m,...l,_master:m._master,masterServiceId:l.masterServiceId||m.masterServiceId}:m;
    });
    // Keep admin-created extra services too.
    const masterNames=new Set(rows.map(x=>norm(x.name)));
    for(const l of live)if(!masterNames.has(norm(l.name))&&(l.status||'Published')==='Published')rows.push(l);
    render();
  }catch(e){console.warn('Admin service overrides unavailable; bundled catalogue remains active.',e)}
}
setTimeout(mergeAdminData,400);

els.grid.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-id]');if(!b)return;
  const svc=rows.find(x=>x.id===b.dataset.id);if(!svc)return;
  els.title.textContent=svc.name;
  let acts=[];
  try{if(window.Portal&&typeof window.Portal.actions==='function')acts=await window.Portal.actions(svc.id)}catch(e){console.warn('Live actions unavailable; bundled actions used.',e)}
  if(!Array.isArray(acts)||!acts.length){
    const ms=svc._master||MASTER_SERVICES.find(m=>m.id===svc.masterServiceId||norm(m.name)===norm(svc.name));
    if(ms)acts=ms.actions.map((a,i)=>({id:actionId(ms.id,a[0]),serviceId:svc.id,name:a[0],serviceCharge:Number(a[1]||0),officialFee:0,description:`${ms.name} - ${a[0]} service/assistance request.`,requiredDocuments:a[3]||[],availabilityStatus:a[2]||'Available',available:(a[2]||'Available')==='Available',order:(i+1)*10}));
  }
  els.actions.innerHTML=acts.length?acts.map(a=>{const st=a.availabilityStatus||((a.available!==false)?'Available':'Unavailable');return `<article class="card" style="margin-top:12px"><span class="status ${statusClass(st)}">${esc(st)}</span><h3>${esc(a.name)}</h3><p>${esc(a.description||'')}</p><div class="price">${money(a.serviceCharge||0)} <small>${a.commissionApplied?'Final Charge':'Service Charge'}</small></div>${a.commissionApplied?`<p class="notice" style="margin-top:8px"><b>Commission User:</b> Original ${money(a.originalServiceCharge||0)} − Commission ${money(a.commissionAmount||0)} = <b>${money(a.serviceCharge||0)}</b></p>`:''}${Number(a.officialFee||0)>0?`<p>Official Fee: ${money(a.officialFee)}</p>`:''}<ol class="doc-list">${(a.requiredDocuments||[]).map(d=>`<li>${esc(d)}</li>`).join('')}</ol><div class="actions"><a class="btn btn-primary ${st!=='Available'?'disabled':''}" ${st==='Available'?`href="apply.html?service=${encodeURIComponent(svc.id)}&action=${encodeURIComponent(a.id)}" target="${svc.target==='_blank'?'_blank':'_self'}" ${svc.target==='_blank'?'rel="noopener"':''}`:'style="pointer-events:none;opacity:.5"'}>Apply Now</a></div></article>`}).join(''):'<div class="notice">Is service ke actions available nahi hain.</div>';
  els.modal.classList.add('show');
});
</script>
</body></html>
