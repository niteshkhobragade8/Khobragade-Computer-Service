<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile - KCSC Portal</title><link rel="stylesheet" href="assets/portal.css"></head><body><div class="topbar"><div class="container">Profile</div></div><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">K</span><span><b>Khobragade Computer Service Centre</b><small>My Profile</small></span></a><div class="navlinks"><a href="account.html">My Account</a><span id="navAuth"></span></div></div></header><main class="section"><div class="container" style="max-width:700px"><form id="profileForm" class="card"><h2>Edit Profile</h2><div class="field"><label>Full Name</label><input id="fullName"></div><div class="field"><label>Email (Optional)</label><input id="email" type="email"></div><div class="field"><label>Mobile</label><input id="mobile" disabled></div><button class="btn btn-primary">Update Profile</button><div id="msg" class="msg"></div></form></div></main><script type="module" src="assets/portal.js"></script><script type="module">import{db}from'../../firebase-config.js';import{doc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';document.addEventListener('portal-auth',e=>{if(!e.detail.user){location.href='index.html?auth=login';return}const p=e.detail.profile||{};fullName.value=p.fullName||'';email.value=p.email||'';mobile.value=p.mobile||'';profileForm.onsubmit=async ev=>{ev.preventDefault();try{await updateDoc(doc(db,'users',e.detail.user.uid),{fullName:fullName.value.trim(),email:email.value.trim(),updatedAt:serverTimestamp()});msg.textContent='Profile updated.';msg.className='msg show ok'}catch(err){msg.textContent=err.message;msg.className='msg show err'}}},{once:true});</script></body></html>
