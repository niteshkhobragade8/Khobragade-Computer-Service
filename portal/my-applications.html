<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Applications - KCSC Portal</title><link rel="stylesheet" href="assets/portal.css?v=20260821-final24r3"></head><body><div class="topbar"><div class="container">My Applications</div></div><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">K</span><span><b>Khobragade Computer Service Centre</b><small>Applications & Payments Portal</small></span></a><div class="navlinks"><a href="services.html">Services</a><a href="account.html">My Account</a><span id="navAuth"></span></div></div></header><main class="section"><div class="container"><div class="section-head"><div><h2>My Applications</h2><p>Payment, processing, user message aur completed slip/file.</p></div><a class="btn btn-primary" href="services.html">+ Apply</a></div><div id="list"></div></div></main><script type="module">
if('scrollRestoration' in history)history.scrollRestoration='manual';window.scrollTo(0,0);

import './assets/portal.js?v=20260821-final24r3';
document.addEventListener('portal-auth',async e=>{if(!e.detail.user){location.href='index.html?auth=login';return}const rows=await Portal.myApplications();list.innerHTML=rows.map(x=>`<article class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><span class="status ${Portal.statusClass(x.status||'Pending')}">${Portal.esc(x.status||'Pending')}</span><h3>${Portal.esc(x.serviceName)} — ${Portal.esc(x.actionName||'')}</h3><b>${Portal.esc(x.applicationId)}</b></div><div><div class="price">${Portal.money(x.amount||0)}</div><span class="status ${Portal.statusClass(x.paymentStatus||'Pending')}">${Portal.esc(x.paymentStatus||'Pending')}</span></div></div>${x.userMessage?`<div class="notice" style="margin-top:14px"><b>Admin Message:</b> ${Portal.esc(x.userMessage)}</div>`:''}${x.rejectionReason?`<div class="msg show err"><b>Reason:</b> ${Portal.esc(x.rejectionReason)}</div>`:''}<div class="actions">${x.completedFileUrl?`<a class="btn btn-green" target="_blank" href="${Portal.esc(x.completedFileUrl)}">Download Slip / Receipt</a>`:''}${x.finalFileUrl?`<a class="btn btn-primary" target="_blank" href="${Portal.esc(x.finalFileUrl)}">Download Final File</a>`:''}${x.paymentStatus!=='Paid'&&Number(x.amount||0)>0?`<a class="btn btn-primary" href="payment.html?id=${encodeURIComponent(x.id)}">Pay Now</a>`:''}${x.status==='Need Documents'?`<a class="btn btn-soft" href="reupload.html?id=${encodeURIComponent(x.id)}">Upload Missing Documents</a>`:''}${x.status==='Rejected'?`<a class="btn btn-primary" href="apply.html?service=${encodeURIComponent(x.serviceId||'')}&action=${encodeURIComponent(x.actionId||'')}&resubmit=${encodeURIComponent(x.id)}">Edit & Resubmit Application</a>`:''}</div></article>`).join('')||'<div class="card">No applications yet.</div>'},{once:true});</script></body></html>
