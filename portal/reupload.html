<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Documents - KCSC Portal</title><link rel="stylesheet" href="assets/portal.css?v=20260819-final15"></head><body><main class="section"><div class="container" style="max-width:680px"><div class="card"><h2>Upload Missing Documents</h2><p class="notice">Admin message ke hisab se clear documents upload karein.</p><div class="field"><label>Select files</label><input id="files" type="file" multiple accept="image/*,.pdf"></div><button id="upload" class="btn btn-primary">Upload & Resubmit</button><div id="msg" class="msg"></div></div></div></main><script type="module">
if('scrollRestoration' in history)history.scrollRestoration='manual';window.scrollTo(0,0);

import './assets/portal.js?v=20260819-final15';
import{db,storage}from'../../firebase-config.js';import{doc,getDoc,updateDoc,serverTimestamp,arrayUnion}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';import{ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js';document.addEventListener('portal-auth',async e=>{if(!e.detail.user){location.href='index.html?auth=login';return}const id=new URLSearchParams(location.search).get('id'),r=doc(db,'applications',id),s=await getDoc(r);if(!s.exists()||s.data().userId!==e.detail.user.uid){location.href='my-applications.html';return}upload.onclick=async()=>{try{const arr=[];for(const f of files.files){const rr=ref(storage,`applications/${e.detail.user.uid}/${s.data().applicationId}/resubmit-${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`);await uploadBytes(rr,f);arr.push({label:'Resubmitted Document',name:f.name,url:await getDownloadURL(rr),uploadedAt:new Date().toISOString()})}await updateDoc(r,{documents:arrayUnion(...arr),status:'Pending',userMessage:'',updatedAt:serverTimestamp()});msg.textContent='Documents uploaded. Application Pending me bhej di gayi.';msg.className='msg show ok'}catch(err){msg.textContent=err.message;msg.className='msg show err'}}},{once:true});</script></body></html>
