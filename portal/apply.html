<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply - KCSC Portal</title><link rel="stylesheet" href="assets/portal.css"></head><body><div class="topbar"><div class="container">Secure Application Submission</div></div><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">K</span><span><b>Khobragade Computer Service Centre</b><small>Applications & Payments Portal</small></span></a><div class="navlinks"><a href="services.html">Services</a><a href="account.html">My Account</a><span id="navAuth"></span></div></div></header><main class="section"><div class="container" style="max-width:820px"><div id="loading" class="card">Loading application...</div><form id="applyForm" class="card" hidden><h2 id="applyTitle"></h2><p id="applyDesc"></p><div id="priceBox" class="notice"></div><h3>Application Details</h3><div id="dynamicFields"></div><h3>Required Documents</h3><div id="documentFields"></div><label class="field"><span><input id="declaration" type="checkbox" required> Main confirm karta/karti hoon ki di gayi information sahi hai aur displayed Service/Assistance Charge samajh liya hai.</span></label><button class="btn btn-primary" style="width:100%">Submit & Continue to Payment</button><div id="applyMsg" class="msg"></div></form></div></main><script type="module" src="assets/portal.js"></script><script type="module">
await new Promise(r=>document.addEventListener('portal-auth',r,{once:true}));if(!Portal.user){location.href='index.html?auth=login';throw new Error('login')};const sp=new URLSearchParams(location.search),sid=sp.get('service'),aid=sp.get('action');const svcs=await Portal.services(),svc=svcs.find(x=>x.id===sid),acts=await Portal.actions(sid),act=acts.find(x=>x.id===aid);if(!svc||!act){loading.textContent='Invalid service/action.';throw new Error('invalid')};const st=act.availabilityStatus||((act.available!==false)?'Available':'Unavailable');if((svc.availabilityStatus||'Available')!=='Available'||st!=='Available'){loading.textContent='This service/action is currently not available.';throw new Error('unavailable')};const fs=await Portal.fields(aid);applyTitle.textContent=`${svc.name} — ${act.name}`;applyDesc.textContent=act.description||'';priceBox.innerHTML=`<b>Service / Assistance Charge:</b> ${Portal.money(act.serviceCharge||0)}${Number(act.officialFee||0)>0?`<br><b>Official Fee:</b> ${Portal.money(act.officialFee)} (separate)`:''}`;dynamicFields.innerHTML=fs.map(f=>{const req=f.required?'required':'';if(f.type==='select')return `<div class="field"><label>${Portal.esc(f.label)}</label><select name="${f.id}" ${req}>${(f.options||[]).map(o=>`<option>${Portal.esc(o)}</option>`).join('')}</select></div>`;if(f.type==='textarea')return `<div class="field"><label>${Portal.esc(f.label)}</label><textarea name="${f.id}" ${req}></textarea></div>`;return `<div class="field"><label>${Portal.esc(f.label)}</label><input name="${f.id}" type="${['date','number','email','tel'].includes(f.type)?f.type:'text'}" ${req}></div>`}).join('');documentFields.innerHTML=(act.requiredDocuments||[]).map((d,i)=>`<div class="field"><label>${Portal.esc(d)}</label><input type="file" data-doc="${i}" accept="image/*,.pdf" required></div>`).join('')||'<p class="hint">No mandatory documents configured.</p>';loading.hidden=true;applyForm.hidden=false;applyForm.onsubmit=async e=>{e.preventDefault();const msg=applyMsg;try{const fd=new FormData(applyForm),data={};fs.forEach(f=>data[f.label]=fd.get(f.id)||'');const uploads=[...documentFields.querySelectorAll('input[type=file]')].map((i,idx)=>({label:(act.requiredDocuments||[])[idx]||'Document',file:i.files[0]}));const app=await Portal.createApplication({service:svc,action:act,formData:data,files:uploads});msg.textContent=`Application ${app.applicationId} created.`;msg.className='msg show ok';if(app.amount>0)await Portal.startPayment(app);else location.href='my-applications.html'}catch(err){msg.textContent=err.message;msg.className='msg show err'}};
</script></body></html>
