<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply - KCSC Portal</title><link rel="stylesheet" href="assets/portal.css"></head><body><main class="section"><div class="container" style="max-width:900px"><div id="loading" class="card">Loading application...</div><form id="applyForm" class="card" hidden><div class="application-form-head"><div><span class="dashboard-kicker">NEW APPLICATION</span><h2 id="applyTitle"></h2><p id="applyDesc"></p></div><label class="profile-autofill-switch"><input id="useProfile" type="checkbox" checked><span><b>Use Profile Details</b><small>Name, mobile, DOB, address etc. auto-fill</small></span></label></div><div id="profilePrefillNotice" class="notice profile-prefill-notice"></div><div id="priceBox" class="notice"></div><h3>Application Details</h3><div id="dynamicFields" class="profile-fields-grid"></div><h3>Required Documents</h3><div id="profilePhotoOption"></div><div id="documentFields"></div><label class="field"><span><input id="declaration" type="checkbox" required> Main confirm karta/karti hoon ki di gayi information sahi hai aur displayed Service/Assistance Charge samajh liya hai.</span></label><button class="btn btn-primary" style="width:100%">Submit & Continue to Payment</button><div id="applyMsg" class="msg"></div></form></div></main><script type="module" src="assets/portal.js"></script><script type="module">
await new Promise(r=>document.addEventListener('portal-auth',r,{once:true}));if(!Portal.user){location.href='index.html?auth=login';throw new Error('login')};const profile=Portal.profile||{},sp=new URLSearchParams(location.search),sid=sp.get('service'),aid=sp.get('action');const svcs=await Portal.services(),svc=svcs.find(x=>x.id===sid),acts=await Portal.actions(sid),act=acts.find(x=>x.id===aid);if(!svc||!act){loading.textContent='Invalid service/action.';throw new Error('invalid')};const st=act.availabilityStatus||((act.available!==false)?'Available':'Unavailable');if((svc.availabilityStatus||'Available')!=='Available'||st!=='Available'){loading.textContent='This service/action is currently not available.';throw new Error('unavailable')};const fs=await Portal.fields(aid);applyTitle.textContent=`${svc.name} — ${act.name}`;applyDesc.textContent=act.description||'';priceBox.innerHTML=`<b>Service / Assistance Charge:</b> ${Portal.money(act.serviceCharge||0)}${Number(act.officialFee||0)>0?`<br><b>Official Fee:</b> ${Portal.money(act.officialFee)} (separate)`:''}`;
function inputHtml(f){const req=f.required?'required':'';const v=useProfile.checked?Portal.profileAutofill(f,profile):'';if(f.type==='select')return `<div class="field"><label>${Portal.esc(f.label)}</label><select name="${f.id}" data-autofill-key="${Portal.esc(Portal.inferProfileKey(f))}" ${req}><option value="">Select</option>${(f.options||[]).map(o=>`<option ${String(o)===String(v)?'selected':''}>${Portal.esc(o)}</option>`).join('')}</select></div>`;if(f.type==='textarea')return `<div class="field profile-field-wide"><label>${Portal.esc(f.label)}</label><textarea name="${f.id}" data-autofill-key="${Portal.esc(Portal.inferProfileKey(f))}" ${req}>${Portal.esc(v)}</textarea></div>`;return `<div class="field"><label>${Portal.esc(f.label)}</label><input name="${f.id}" data-autofill-key="${Portal.esc(Portal.inferProfileKey(f))}" type="${['date','number','email','tel'].includes(f.type)?f.type:'text'}" value="${Portal.esc(v)}" ${req}></div>`}
function renderFields(){dynamicFields.innerHTML=fs.map(inputHtml).join('')||'<p class="hint">No extra form fields configured.</p>';const filled=fs.filter(f=>Portal.profileAutofill(f,profile)).length;profilePrefillNotice.innerHTML=useProfile.checked?`✅ <b>${filled} profile field(s) auto-filled.</b> Application ke liye value change kar sakte hain; Profile tab tak change nahi hogi.`:'Profile auto-fill OFF hai.'}
useProfile.addEventListener('change',renderFields);renderFields();
const docs=act.requiredDocuments||[],photoIndex=docs.findIndex(d=>/photo|photograph|passport photo/i.test(String(d)));const canUseProfilePhoto=photoIndex>=0&&profile.photoURL;let useProfilePhoto=Boolean(canUseProfilePhoto);if(canUseProfilePhoto){profilePhotoOption.innerHTML=`<div class="profile-photo-apply"><img src="${Portal.esc(profile.photoURL)}" alt="Profile Photo"><label><input id="useProfilePhoto" type="checkbox" checked> <b>Use saved Profile Photo</b><small>Uncheck karke neeche nayi photo upload kar sakte hain.</small></label></div>`;const useProfilePhotoEl=document.getElementById('useProfilePhoto');useProfilePhotoEl.addEventListener('change',()=>{useProfilePhoto=useProfilePhotoEl.checked;renderDocs()})}else if(photoIndex>=0){profilePhotoOption.innerHTML='<div class="notice">Profile photo saved nahi hai. Photo document upload karein ya Profile me photo add karein.</div>'}
function renderDocs(){documentFields.innerHTML=docs.map((d,i)=>{const profilePhotoUsed=i===photoIndex&&useProfilePhoto;return `<div class="field"><label>${Portal.esc(d)}${profilePhotoUsed?' — Profile Photo selected':''}</label><input type="file" data-doc="${i}" accept="image/*,.pdf" ${profilePhotoUsed?'disabled':'required'}></div>`}).join('')||'<p class="hint">No mandatory documents configured.</p>'}renderDocs();loading.hidden=true;applyForm.hidden=false;
applyForm.onsubmit=async e=>{e.preventDefault();const msg=applyMsg;try{const fd=new FormData(applyForm),data={};fs.forEach(f=>data[f.label]=fd.get(f.id)||'');const inputs=[...documentFields.querySelectorAll('input[type=file]')],uploads=[];docs.forEach((label,idx)=>{if(idx===photoIndex&&useProfilePhoto&&profile.photoURL)uploads.push({label,name:'Profile Photo',url:profile.photoURL,source:'profile'});else uploads.push({label,file:inputs[idx]?.files?.[0]})});const app=await Portal.createApplication({service:svc,action:act,formData:data,files:uploads});msg.textContent=`Application ${app.applicationId} created.`;msg.className='msg show ok';if(app.amount>0)await Portal.startPayment(app);else location.href='my-applications.html'}catch(err){msg.textContent=err.message;msg.className='msg show err'}};
</script></body></html>
