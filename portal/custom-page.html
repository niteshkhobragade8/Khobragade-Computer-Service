<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Page - KCSC Portal</title><link rel="stylesheet" href="assets/portal.css?v=20260821-v25final"></head><body><main class="section"><div class="container" style="max-width:1000px"><article class="card"><span class="dashboard-kicker">USER PAGE</span><h2 id="customPageTitle">Loading...</h2><p id="customPageIntro"></p><div id="customPageContent" class="custom-user-page-content"></div></article></div></main><script type="module">import './assets/portal.js?v=20260821-v25final';await Portal.ready();if(!Portal.user){location.href='index.html?auth=login';throw new Error('login')}const slug=new URLSearchParams(location.search).get('slug')||'';const page=(Portal.cms?.pages||[]).find(x=>x.slug===slug&&x.type==='custom'&&x.visible!==false);if(!page){document.getElementById('customPageTitle').textContent='Page not available';document.getElementById('customPageIntro').textContent='This page is hidden or does not exist.'}else{document.title=(page.title||'User Page')+' - KCSC Portal';document.getElementById('customPageTitle').textContent=page.heading||page.title||'User Page';document.getElementById('customPageIntro').textContent=page.intro||'';document.getElementById('customPageContent').innerHTML=page.content||'<p>No content added yet.</p>'}</script></body></html>
