<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KCSC Portal</title><link rel="stylesheet" href="assets/portal.css?v=20260821-final25"></head><body><main class="section"><div class="container" style="max-width:900px"><div id="customPageBox" class="card">Loading page...</div></div></main><script type="module">import './assets/portal.js?v=20260821-final25';await Portal.ready();if(!Portal.user){location.href='index.html?auth=login';throw new Error('login')}const slug=new URLSearchParams(location.search).get('slug')||'';const pages=Array.isArray(Portal.cms.userPages)?Portal.cms.userPages:[];const page=pages.find(x=>x.slug===slug&&x.visible!==false&&!x.system);const box=document.getElementById('customPageBox');if(!page){box.innerHTML='<h2>Page not found</h2><p>This user page is hidden or unavailable.</p>'}else{document.title=page.title+' - KCSC';box.innerHTML=`<h2>${Portal.esc(page.title)}</h2><div style="white-space:pre-wrap;line-height:1.7">${Portal.esc(page.content||'')}</div>`}</script></body></html>
