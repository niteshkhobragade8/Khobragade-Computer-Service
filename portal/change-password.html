<!doctype html>
<html class="member-shell-wait" lang="hi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password - KCSC</title><link rel="stylesheet" href="assets/portal.css?v=20260824-supabasefinal1"></head>
<body class="member-dashboard">
<main class="section member-main"><div class="container account-grid"><aside class="account-menu member-menu"></aside><section class="dashboard-content">
<div class="dashboard-welcome"><div><span class="dashboard-kicker">SECURITY REQUIRED</span><h1>Change Password</h1><p>Admin ne temporary password set kiya hai. Continue karne se pehle apna naya password set karein.</p></div></div>
<div class="card" style="max-width:620px"><h2>🔐 Set New Password</h2>
<div class="field"><label>New Password</label><div class="portal-password-wrap"><input id="newPassword" type="password" minlength="6"><button type="button" class="portal-password-eye" data-password-target="newPassword">👁</button></div></div>
<div class="field"><label>Confirm New Password</label><div class="portal-password-wrap"><input id="confirmNewPassword" type="password" minlength="6"><button type="button" class="portal-password-eye" data-password-target="confirmNewPassword">👁</button></div></div>
<button id="saveNewPassword" class="btn btn-primary" type="button">Change Password</button><div id="changePasswordMsg" class="msg"></div></div>
</section></div></main>
<script type="module">
import './assets/portal.js?v=20260825-totalfix1';
document.querySelectorAll('[data-password-target]').forEach(btn=>btn.onclick=()=>{const i=document.getElementById(btn.dataset.passwordTarget);const s=i.type==='password';i.type=s?'text':'password';btn.textContent=s?'🙈':'👁'});
document.addEventListener('portal-auth',e=>{if(!e.detail.user){location.replace('index.html?auth=login')}});
saveNewPassword.onclick=async()=>{const a=newPassword.value,b=confirmNewPassword.value;if(a.length<6){changePasswordMsg.textContent='Password minimum 6 characters hona chahiye.';changePasswordMsg.className='msg show err';return}if(a!==b){changePasswordMsg.textContent='Password aur Confirm Password match nahi hai.';changePasswordMsg.className='msg show err';return}saveNewPassword.disabled=true;try{await Portal.changeOwnPassword(a);changePasswordMsg.textContent='Password changed successfully ✅';changePasswordMsg.className='msg show ok';const p=Portal.profile||{};setTimeout(()=>location.replace(Portal.commissionProfileActive(p)?'commission-dashboard.html':'account.html'),700)}catch(err){changePasswordMsg.textContent=err.message;changePasswordMsg.className='msg show err'}finally{saveNewPassword.disabled=false}};
</script></body></html>
