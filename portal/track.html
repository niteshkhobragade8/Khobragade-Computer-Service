<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Application - KCSC Portal</title><link rel="stylesheet" href="assets/portal.css?v=20260821-final24r2"></head><body><div class="topbar"><div class="container">Track Application</div></div><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><span class="brand-mark">K</span><span><b>Khobragade Computer Service Centre</b><small>Application Status</small></span></a><div class="navlinks"><a href="index.html">Home</a><a href="services.html">Services</a><span id="navAuth"></span></div></div></header><main class="section"><div class="container" style="max-width:680px"><div class="card"><h2>Track Your Application</h2><p class="hint">Application ID aur registered mobile number enter karein.</p><form id="trackForm"><div class="field"><label>Application ID</label><input id="trackId" placeholder="KCSC-2026-..."></div><div class="field"><label>Mobile Number</label><input id="trackMobile" maxlength="10" inputmode="numeric"></div><button class="btn btn-primary" style="width:100%">Track Status</button></form><div id="result" style="margin-top:18px"></div></div></div></main><script type="module">
if('scrollRestoration' in history)history.scrollRestoration='manual';window.scrollTo(0,0);

import './assets/portal.js?v=20260821-final24r2';
trackForm.onsubmit=async e=>{e.preventDefault();const x=await Portal.trackPublic(trackId.value,trackMobile.value).catch(()=>null);result.innerHTML=x?`<div class="card"><span class="status ${Portal.statusClass(x.status)}">${Portal.esc(x.status)}</span><h3>${Portal.esc(x.serviceName)}</h3><p>${Portal.esc(x.actionName||'')}</p><b>${Portal.esc(x.applicationId)}</b><p>Payment: <b>${Portal.esc(x.paymentStatus||'Pending')}</b></p>${x.userMessage?`<div class="notice">${Portal.esc(x.userMessage)}</div>`:''}</div>`:'<div class="msg show err">Application details match nahi hui.</div>'};</script></body></html>
