<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maintenance Preview | Khobragade Computer Service Centre</title>
  <style>
    *{box-sizing:border-box}
    :root{
      --ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--card:#ffffff;
      --blue:#2563eb;--pink:#ec4899;--green:#16a34a;--amber:#f59e0b
    }
    body{
      margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 18%,rgba(37,99,235,.18),transparent 28%),
        radial-gradient(circle at 88% 12%,rgba(236,72,153,.16),transparent 30%),
        linear-gradient(135deg,#eef4ff 0%,#fff8ef 52%,#f8fafc 100%);
      display:grid;place-items:center;padding:28px;
    }
    .shell{width:min(900px,100%)}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px
    }
    .brand{display:flex;align-items:center;gap:12px;font-weight:900}
    .brand-mark{
      width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:white;font-size:22px;
      background:linear-gradient(135deg,var(--blue),var(--pink));box-shadow:0 10px 30px rgba(37,99,235,.25)
    }
    .brand small{display:block;color:var(--muted);font-weight:700;margin-top:2px}
    .back-btn{
      border:1px solid var(--line);background:#fff;color:#0f172a;padding:10px 14px;border-radius:12px;
      font-weight:800;text-decoration:none;box-shadow:0 6px 18px rgba(15,23,42,.06)
    }
    .card{
      background:rgba(255,255,255,.96);border:1px solid rgba(226,232,240,.95);border-radius:28px;
      padding:44px 34px;text-align:center;box-shadow:0 28px 80px rgba(15,23,42,.16);
      backdrop-filter:blur(10px)
    }
    .tool{
      width:76px;height:76px;border-radius:22px;margin:0 auto 16px;display:grid;place-items:center;font-size:36px;
      background:linear-gradient(135deg,#dbeafe,#fce7f3);box-shadow:inset 0 0 0 1px #e2e8f0
    }
    .status{
      display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
      background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-weight:900;font-size:12px;
      letter-spacing:.9px;text-transform:uppercase
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 5px rgba(245,158,11,.14)}
    h1{margin:18px auto 10px;max-width:760px;font-size:clamp(30px,5vw,50px);line-height:1.08}
    .message{max-width:680px;margin:0 auto;color:var(--muted);font-size:18px;line-height:1.7}
    .reopen{
      display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:12px 16px;border-radius:14px;
      background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-weight:850
    }
    .preview-note{
      margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);color:#94a3b8;font-size:13px
    }
    @media(max-width:640px){
      body{padding:16px}.topbar{align-items:flex-start}.brand small{font-size:11px}
      .card{padding:32px 20px;border-radius:22px}.message{font-size:16px}
      .back-btn{padding:9px 11px;font-size:13px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <div>Khobragade Computer Service Centre<small>Maintenance Preview</small></div>
      </div>
      <a class="back-btn" href="dashboard.html">← Back to Admin Dashboard</a>
    </div>

    <section class="card">
      <div class="tool">🛠️</div>
      <div class="status"><span class="dot"></span><span id="statusText">UPDATE IN PROGRESS</span></div>
      <h1 id="title">Khobragade Computer Service Centre is being updated</h1>
      <p id="message" class="message">New improvements are being added. Please check back shortly.</p>
      <div id="reopenWrap" class="reopen" style="display:none">🕒 <span id="reopenText"></span></div>
      <div class="preview-note">This is only a preview. Website status is not changed from this page.</div>
    </section>
  </main>

  <script>
    const defaults={
      title:"Khobragade Computer Service Centre is being updated",
      message:"New improvements are being added. Please check back shortly.",
      statusText:"UPDATE IN PROGRESS",reopen:""
    };
    let data=defaults;
    try{data={...defaults,...JSON.parse(sessionStorage.getItem("kcsc_maintenance_preview_v1")||"{}")}}catch(e){}
    document.getElementById("title").textContent=data.title||defaults.title;
    document.getElementById("message").textContent=data.message||defaults.message;
    document.getElementById("statusText").textContent=data.statusText||defaults.statusText;
    if(data.reopen){
      document.getElementById("reopenWrap").style.display="inline-flex";
      document.getElementById("reopenText").textContent="Expected Reopen: "+new Date(data.reopen).toLocaleString();
    }
  </script>
</body>
</html>
