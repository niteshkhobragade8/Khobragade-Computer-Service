const norm=v=>String(v||'').replace(/\s+/g,' ').trim().toLowerCase();
const btn=document.getElementById('runBtn');
const status=document.getElementById('status');
function setStatus(t,cls=''){status.textContent=t;status.className=cls}

btn.addEventListener('click',async()=>{
  if(!confirm('Existing data safe rakhkar missing services add karein?'))return;
  btn.disabled=true;
  try{
    setStatus('Current Supabase services check ho rahe hain...');
    const snap=await getDocs(collection(db,'services'));
    const existing=snap.docs.map(d=>({id:d.id,...d.data()}));
    const names=new Set(existing.map(x=>norm(x.name)).filter(Boolean));
    const missing=TARGET.filter(x=>!names.has(norm(x.name)));
    setStatus(`Current: ${existing.length}
Target catalogue: ${TARGET.length}
Missing to add: ${missing.length}`);
    let added=0;
    for(const item of missing){
      await addDoc(collection(db,'services'),{...item,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
      names.add(norm(item.name));
      added++;
      if(added%10===0||added===missing.length)setStatus(`Adding missing services... ${added} / ${missing.length}`);
    }
    const verify=await getDocs(collection(db,'services'));
    const rows=verify.docs.map(d=>({id:d.id,...d.data()}));
    const unique=new Set(rows.map(x=>norm(x.name)).filter(Boolean));
    const targetPresent=TARGET.filter(x=>unique.has(norm(x.name))).length;
    const msg=`✅ Sync complete
Added: ${added}
Database rows now: ${rows.length}
Target 242 names present: ${targetPresent} / 242`;
    if(targetPresent===242)setStatus(msg,'ok'); else setStatus(msg+'
Some target services are still missing.','err');
  }catch(err){
    console.error(err);
    setStatus('❌ Sync failed: '+(err?.message||err),'err');
  }finally{btn.disabled=false}
});
</script>
